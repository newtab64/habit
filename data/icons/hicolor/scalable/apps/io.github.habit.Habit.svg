<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="50%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#8ff0a4"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#051b3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Shadow & Surface -->
  <rect x="12" y="16" width="104" height="100" rx="24" fill="#0d3b75" opacity="0.35"/>
  <rect x="12" y="14" width="104" height="100" rx="24" fill="#15539e"/>
  <rect x="12" y="12" width="104" height="100" rx="24" fill="url(#bgGrad)"/>

  <!-- Subtle Top Highlight -->
  <path d="M 36 13 L 92 13" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Dial Area -->
  <circle cx="64" cy="62" r="38" fill="#145198" opacity="0.35"/>

  <!-- Background Progress Ring Track -->
  <circle cx="64" cy="62" r="28" fill="none" stroke="url(#trackGrad)" stroke-width="7"/>

  <!-- Active Habit Strength Loop Arc (approx. 80% complete) -->
  <circle cx="64" cy="62" r="28" fill="none" stroke="url(#progressGrad)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="140 176" transform="rotate(-90 64 62)"/>

  <!-- Center Checkmark -->
  <path d="M 51 62.5 L 60 71.5 L 77 52.5" fill="none" stroke="#ffffff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
